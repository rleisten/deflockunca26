<body>
<header>
  <div>
    <h1>SAFETY AS A SCAPEGOAT: Flock and Automated Surveillance</h1>
    <p>Click a campus or a camera to see how its data is collected, stored, and shared.</p>
  </div>
  <div class="header-actions">
    <select id="campus-picker" aria-label="Choose a campus">
      <option value="">All campuses</option>
    </select>
    <label id="overlay-opacity-wrap" hidden>
      <span class="sr-only">Campus map opacity</span>
      <input id="overlay-opacity" type="range" min="0.2" max="1" step="0.05" value="0.8">
    </label>
    <!-- Campus map button is hidden. To bring it back, delete the word "hidden" below. -->
    <button id="overlay-toggle" class="btn" type="button" hidden aria-pressed="false" title="Show UNC Asheville campus map" aria-label="Show UNC Asheville campus map">🎓</button>
    <button id="more-viz" class="btn" type="button" aria-haspopup="dialog">Who's accessing this data?</button>
    <button id="more-info" class="btn" type="button" data-modal="more-info">More info</button>
    <button id="satellite-toggle" class="btn" type="button" aria-pressed="false"></button>
    <button id="theme-toggle" class="btn" type="button"></button>
  </div>
</header>
<main>
  <div id="map"></div>
  <button id="panel-toggle" class="btn" type="button" aria-controls="panel-wrap" aria-expanded="true"></button>
  <aside id="panel-wrap">
    <button id="about-flock" class="btn about-btn" type="button" data-modal="how-data-is-shared">About Flock Data</button>
    <div id="panel"></div>
    <footer id="provenance">
      Camera locations: DeFlock / OpenStreetMap contributors (ODbL), crowd-sourced and
      possibly incomplete. 
    </footer>
  </aside>
</main>

  <button class="modal-close btn" type="button" data-close-modal aria-label="Close">×</button>
  <div id="modal-body"></div>
</dialog>
